<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Auditorías CBC · Plataforma de control</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Questrial&display=swap">
<style>
:root{
  --font:"Century Gothic","Questrial","URW Gothic","Avenir Next",system-ui,sans-serif;
  --bg:#F3F5F8; --surface:#FFFFFF; --surface2:#F7F9FB; --line:#E3E8EF; --ink:#16202E; --ink2:#4B5768; --ink3:#6B7686;
  --brand:#1679B8; --brand-ink:#FFFFFF; --brand-soft:#E3F1FA; --slate:#3E4C5E;
  --ok:#2E7D4F; --ok-soft:#E3F3E9; --warn:#B45309; --warn-soft:#FDEFD9; --bad:#C2410C; --bad-soft:#FDE6DA;
  --c1:#7B4FA0; --c2:#F08A24; --c3:#5BA33A; --c4:#2E9BD6; --c5:#F5C518;
  --map:#E9EEF3; --street:#FFFFFF; --sea:#CFE3F2;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1621; --surface:#172131; --surface2:#1C2839; --line:#2A3A50; --ink:#E8EEF6; --ink2:#B4C0CF; --ink3:#93A1B3;
    --brand:#3A9AD9; --brand-ink:#08131F; --brand-soft:#173550; --slate:#2A384A;
    --ok:#5CC48A; --ok-soft:#163626; --warn:#F2B260; --warn-soft:#3A2A12; --bad:#F38B5A; --bad-soft:#3B2115;
    --map:#1A2636; --street:#243449; --sea:#16314A; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1621; --surface:#172131; --surface2:#1C2839; --line:#2A3A50; --ink:#E8EEF6; --ink2:#B4C0CF; --ink3:#93A1B3;
  --brand:#3A9AD9; --brand-ink:#08131F; --brand-soft:#173550; --slate:#2A384A;
  --ok:#5CC48A; --ok-soft:#163626; --warn:#F2B260; --warn-soft:#3A2A12; --bad:#F38B5A; --bad-soft:#3B2115;
  --map:#1A2636; --street:#243449; --sea:#16314A; color-scheme: dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:6px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.top-in{max-width:1400px;margin:0 auto;padding:10px 24px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink)}
.brand img{height:34px;width:auto}
.brand .sep{width:1px;height:30px;background:var(--line)}
.brand b{display:block;font-size:16px}.brand small{color:var(--ink3);font-size:12px}
.logo-dark{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo-light{display:none}:root:not([data-theme="light"]) .logo-dark{display:inline}}
:root[data-theme="dark"] .logo-light{display:none}:root[data-theme="dark"] .logo-dark{display:inline}
nav.main{display:flex;gap:2px;flex-wrap:wrap;margin-left:auto}
nav.main a{white-space:nowrap;padding:9px 13px;border-radius:9px;text-decoration:none;color:var(--ink2);font-size:14px}
nav.main a:hover{background:var(--surface2)}
nav.main a.on{background:var(--slate);color:#fff}
.strip{display:grid;grid-template-columns:repeat(5,1fr);height:4px}
.strip i:nth-child(1){background:var(--c1)}.strip i:nth-child(2){background:var(--c2)}.strip i:nth-child(3){background:var(--c3)}.strip i:nth-child(4){background:var(--c4)}.strip i:nth-child(5){background:var(--c5)}
main{max-width:1400px;margin:0 auto;padding:24px 24px 56px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:20px}
h1{font-size:26px;margin:0;line-height:1.2}
.sub{color:var(--ink3);margin:4px 0 0;font-size:14px}
.demo{font-size:11px;background:var(--warn-soft);color:var(--warn);padding:2px 7px;border-radius:5px;margin-left:6px}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink3)}
select,input[type=search],input[type=text],input[type=number],input[type=date]{height:42px;padding:0 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface);font-size:14px;min-width:0}
.btn{height:42px;padding:0 16px;border-radius:9px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.sm{height:34px;padding:0 12px;font-size:13px}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.kpi span{display:block;color:var(--ink3);font-size:13px}
.kpi strong{display:block;font-size:30px;line-height:1.15;margin-top:4px}
.kpi strong small{font-size:15px;color:var(--ink3);font-weight:500}
.kpi em{display:block;font-style:normal;font-size:12px;color:var(--ink3);margin-top:4px}
.kpi em.w{color:var(--warn);font-weight:600}
.meter{height:7px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;background:var(--brand);border-radius:4px}
.meter i.w{background:var(--c2)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.panel h2{font-size:17px;margin:0}
.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.ph small{color:var(--ink3);font-size:12px}
.cols{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start;margin-top:16px}
.cols>.wide{flex:999 1 620px;min-width:0}.cols>.narrow{flex:1 1 340px;min-width:0}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;color:var(--ink3);font-weight:600;padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer}tr.click:hover td{background:var(--surface2)}
.num{font-variant-numeric:tabular-nums}
.badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.b-ok{background:var(--ok-soft);color:var(--ok)}.b-warn{background:var(--warn-soft);color:var(--warn)}.b-bad{background:var(--bad-soft);color:var(--bad)}.b-info{background:var(--brand-soft);color:var(--brand)}.b-mute{background:var(--surface2);color:var(--ink2)}
.alert{display:flex;gap:12px;padding:11px 12px;border-radius:10px;margin-top:8px;background:var(--surface2);font-size:14px}
.alert.w{background:var(--warn-soft)}
.alert time{font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink2)}
.bars .row{margin:10px 0}.bars .row div{display:flex;justify-content:space-between;font-size:13px}
.empty{padding:30px;text-align:center;color:var(--ink3)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:13px}
.chip.on{background:var(--slate);color:#fff;border-color:var(--slate)}
.mapbox{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.mapbox svg{display:block;width:100%;height:auto}
.stops{max-height:560px;overflow:auto}
.stop{display:flex;gap:12px;align-items:center;padding:10px;border-radius:10px;cursor:pointer;border:1px solid transparent}
.stop:hover{background:var(--surface2)}.stop.sel{border-color:var(--brand);background:var(--brand-soft)}
.dot{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff;flex:none}
.muted{color:var(--ink3);font-size:13px}
.drawer-bg{position:fixed;inset:0;background:rgba(10,18,30,.45);z-index:40;display:none}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--bg);z-index:41;overflow:auto;transform:translateX(100%);transition:transform .22s ease;padding:calc(env(safe-area-inset-top,0px) + 20px) 22px calc(env(safe-area-inset-bottom,0px) + 24px)}
.drawer.open{transform:none}.drawer-bg.open{display:block}
@media (prefers-reduced-motion: reduce){.drawer{transition:none}}
.photos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.photos figure{margin:0}.photos svg{width:100%;height:auto;border-radius:8px;display:block}
.photos figcaption{font-size:12px;color:var(--ink3);margin-top:4px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateX(-50%);background:var(--slate);color:#fff;padding:12px 18px;border-radius:10px;z-index:60;font-size:14px;display:none;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast.show{display:block}
.pager{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:10px;flex-wrap:wrap}
.heat td{text-align:center;font-weight:700;font-size:13px;border-radius:6px;border:2px solid var(--surface);color:#fff}
.phone-wrap{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-start}
.phone{width:390px;max-width:100%;height:800px;border-radius:44px;background:#111827;padding:14px;flex:none;box-shadow:0 20px 50px rgba(0,0,0,.18)}
.screen{width:100%;height:100%;border-radius:32px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column;position:relative}
.ah{background:var(--slate);color:#fff;padding:18px 18px 16px}
.ah small{color:#D2DAE5;font-size:12px}
.abody{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.anav{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);background:var(--surface)}
.anav button{height:54px;border:0;background:none;font-size:12px;color:var(--ink2);cursor:pointer}
.anav button.on{color:var(--brand);font-weight:700}
.acard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.q{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex:none}
.seg button{border:0;background:var(--surface);padding:8px 12px;cursor:pointer;font-size:13px}
.seg button.on{background:var(--brand);color:var(--brand-ink);font-weight:700}
.shot{aspect-ratio:4/3;border-radius:10px;border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--ink3);cursor:pointer;background:var(--surface);overflow:hidden;padding:0}
.shot svg{width:100%;height:100%}
.steps{display:flex;gap:4px}.steps i{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.25)}.steps i.on{background:#7DBE45}
.notes{flex:1 1 300px;max-width:460px}
.notes li{margin:8px 0;color:var(--ink2)}
@media (max-width:720px){main{padding:16px 14px 40px}.top-in{padding:10px 14px}nav.main{margin-left:0;width:100%;overflow-x:auto;flex-wrap:nowrap}h1{font-size:22px}.phone{height:720px}}
</style>
</head>

  const fondo=label==='Fachada'?'#9CA3AF':'#6B7280';
  return `<svg viewBox="0 0 320 240" role="img" aria-label="${esc(label)}"><rect width="320" height="240" fill="${fondo}"/>${label==='Fachada'?'<rect x="40" y="60" width="240" height="180" fill="#D1D5DB"/><rect x="110" y="120" width="100" height="120" fill="#374151"/><rect x="40" y="40" width="240" height="30" fill="#1679B8"/>':''}${label!=='Fachada'?shelves.join('')+[0,1,2,3].map(y=>`<rect x="0" y="${66+y*52}" width="320" height="6" fill="#4B5563"/>`).join(''):''}<rect x="0" y="210" width="320" height="30" fill="rgba(0,0,0,.6)"/><text x="10" y="230" font-size="12" fill="#fff" font-family="Arial">${esc(stamp)}</text></svg>`;

// ---------- mapa ----------
function mapSVG(points,col,opts={}){
  const W=900,H=560;const r=rng(opts.seed||7);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Mapa de ruta"><rect width="${W}" height="${H}" fill="var(--map)"/>`;
  s+=`<defs><pattern id="grid${opts.seed||0}" width="38" height="38" patternUnits="userSpaceOnUse" patternTransform="rotate(${12+(opts.seed||0)%20})"><path d="M38 0H0V38" fill="none" stroke="var(--street)" stroke-width="3"/></pattern></defs><rect width="${W}" height="${H}" fill="url(#grid${opts.seed||0})"/>`;
  if(opts.sea)s+=`<path d="M0 0 H150 C130 160 210 300 240 560 H0Z" fill="var(--sea)"/>`;
  s+=`<path d="M0 ${200+r()*100} C300 ${150+r()*80} 600 ${300+r()*80} 900 ${220+r()*80}" fill="none" stroke="#F3D58A" stroke-width="7" opacity=".9"/>`;
  s+=`<path d="M${300+r()*200} 0 C${350+r()*150} 200 ${420+r()*150} 380 ${520+r()*150} 560" fill="none" stroke="#F3D58A" stroke-width="7" opacity=".9"/>`;
  (opts.bg||[]).forEach(p=>s+=`<circle cx="${(p.x*W).toFixed(0)}" cy="${(p.y*H).toFixed(0)}" r="4" fill="#AAB4C2"/>`);
  if(points.length){
    const d=points.map((p,i)=>(i?'L':'M')+(p.x*W).toFixed(0)+' '+(p.y*H).toFixed(0)).join(' ');
    s+=`<path d="${d}" fill="none" stroke="#fff" stroke-width="9" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="${col}" stroke-width="5" stroke-linejoin="round"/>`;
    points.forEach((p,i)=>{const sel=opts.sel===i;const done=p.done;
      s+=`<g class="mstop" data-i="${i}" style="cursor:pointer"><circle cx="${(p.x*W).toFixed(0)}" cy="${(p.y*H).toFixed(0)}" r="${sel?17:13}" fill="${done?col:'#fff'}" stroke="${col}" stroke-width="4"/><text x="${(p.x*W).toFixed(0)}" y="${(p.y*H+4.5).toFixed(0)}" font-size="12" font-weight="700" text-anchor="middle" fill="${done?'#fff':col}" font-family="Arial">${i+1}</text></g>`;
      if(sel)s+=`<circle cx="${(p.x*W).toFixed(0)}" cy="${(p.y*H).toFixed(0)}" r="26" fill="none" stroke="${col}" stroke-width="3" stroke-dasharray="6 5"/>`;
    });
  }
  return s+'</svg>';
}
function twoOpt(p){p=p.slice();let imp=true,g=0;const D=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);while(imp&&g++<50){imp=false;for(let i=1;i<p.length-1;i++)for(let k=i+1;k<p.length;k++){const a=p[i-1],b=p[i],c=p[k],d=p[k+1];const before=D(a,b)+(d?D(c,d):0),after=D(a,c)+(d?D(b,d):0);if(after<before-1e-9){p.splice(i,k-i+1,...p.slice(i,k+1).reverse());imp=true}}}return p}
function optRoute(pts){return twoOpt(nnOrder(pts))}
function nnOrder(pts){if(!pts.length)return pts;const left=pts.slice(1),out=[pts[0]];while(left.length){const c=out[out.length-1];let bi=0,bd=1e9;left.forEach((p,i)=>{const d=(p.x-c.x)**2+(p.y-c.y)**2;if(d<bd){bd=d;bi=i}});out.push(left.splice(bi,1)[0])}return out}
function routeKm(pts){let d=0;for(let i=1;i<pts.length;i++)d+=Math.hypot((pts[i].x-pts[i-1].x)*1.6,(pts[i].y-pts[i-1].y)*1.0);return d}

  {const xs=pts.map(p=>p.x),ys=pts.map(p=>p.y),x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);

function appStops(){return optRoute(PDV.filter(p=>p.sede==='LS'&&p.dia===DAYS_ELAPSED).map(p=>({...p})))}
function appScreen(){
  const A=state.app;const stops=appStops();
  const doneIdx=i=>A.done[i]||(i<7&&!(i in A.done));
  const nDone=stops.filter((_,i)=>doneIdx(i)).length;
  const head=(t,sub,step)=>`<div class="ah"><small>${sub}</small><div style="font-size:19px;font-weight:700;margin-top:2px">${t}</div>${step!=null?`<div class="steps" style="margin-top:12px">${[0,1,2,3].map(i=>`<i class="${i<=step?'on':''}"></i>`).join('')}</div>`:''}</div>`;

    ${stops.map((p,i)=>`<div class="acard" style="display:flex;gap:10px;align-items:center;padding:10px 12px"><span class="dot" style="background:${doneIdx(i)?'var(--c3)':'var(--ink3)'}">${i+1}</span><div style="min-width:0;flex:1"><b style="font-size:14px">${esc(p.nom)}</b><div class="muted" style="font-size:12px">${esc(p.dist)}</div></div>${doneIdx(i)?'<span class="badge b-ok">Enviada</span>':'<span class="badge b-mute">Pendiente</span>'}</div>`).join('')}</div>${appNav('ruta')}`;

    return head(esc(p.nom),'Parada '+(A.stop+1)+' · '+p.cod,0)+`<div class="abody"><div class="acard" style="padding:0;overflow:hidden">${mapSVG([{x:.5,y:.5}],'#5BA33A',{seed:A.stop+20,sel:0})}</div>
    <div class="acard"><b>Ubicación verificada</b><p class="muted" style="margin:4px 0 0">Estás a 18 m del PDV, dentro del radio permitido de 50 m.</p></div>
    <div class="acard"><div class="q" style="border:0"><span>¿El PDV está abierto?</span><div class="seg"><button class="${A.ans.abierto!==false?'on':''}" data-ans="abierto" data-v="1">Sí</button><button class="${A.ans.abierto===false?'on':''}" data-ans="abierto" data-v="0">No</button></div></div></div>
    <button class="btn pri" style="width:100%" data-app="${A.ans.abierto===false?'fotos':'form'}">Marcar llegada · ${new Date().toTimeString().slice(0,5)}</button>
    <button class="btn" style="width:100%" data-app="ruta">Volver a la ruta</button></div>`;
  }
  if(A.screen==='form'){
    const all=IND.every(x=>x.k in A.ans);
    return head('Formulario CBC',esc(p.nom),1)+`<div class="abody"><div class="acard">${IND.map(x=>`<div class="q"><span>${x.n}</span><div class="seg"><button class="${A.ans[x.k]===true?'on':''}" data-ans="${x.k}" data-v="1">Cumple</button><button class="${A.ans[x.k]===false?'on':''}" data-ans="${x.k}" data-v="0">No</button></div></div>`).join('')}
    <label class="f" style="margin-top:12px">Comentario<textarea rows="3" data-ans-text style="padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--surface)">${esc(A.ans.com||'')}</textarea></label></div>
    <button class="btn pri" style="width:100%" data-app="fotos" ${all?'':'disabled'}>${all?'Continuar a fotos':'Completa los 6 indicadores'}</button></div>`;
  }
  if(A.screen==='fotos'){
    const req=A.ans.abierto===false?['Fachada']:['Fachada','Anaquel','Enfriador','Material POP'];
    const ok=req.every(t=>A.shots[t]);
    return head('Evidencia fotográfica',esc(p.nom),2)+`<div class="abody"><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">${req.map((t,i)=>`<button class="shot" data-shot="${t}" aria-label="Tomar foto: ${t}">${A.shots[t]?photoSVG(A.stop*10+i,t,A.shots[t]):'Tomar foto<br>'+t}</button>`).join('')}</div>
    <p class="muted" style="margin:0">Cada foto queda sellada con fecha, hora y coordenadas.</p>
    <button class="btn pri" style="width:100%" data-app="resumen" ${ok?'':'disabled'}>${ok?'Revisar y enviar':'Faltan '+req.filter(t=>!A.shots[t]).length+' fotos'}</button></div>`;
  }
  if(A.screen==='resumen'){
    const cerr=A.ans.abierto===false;const sc=cerr?null:Math.round(IND.filter(x=>A.ans[x.k]).length/IND.length*100);
    return head('Resumen de la visita',esc(p.nom),3)+`<div class="abody"><div class="acard" style="text-align:center"><div class="muted">${cerr?'Visita no efectiva':'Score del PDV'}</div><div style="font-size:44px;font-weight:700;color:var(--brand)">${cerr?'Cerrado':sc+'%'}</div></div>
    ${cerr?'':`<div class="acard">${IND.map(x=>`<div class="q"><span>${x.n}</span>${A.ans[x.k]?'<span class="badge b-ok">Cumple</span>':'<span class="badge b-bad">No cumple</span>'}</div>`).join('')}</div>`}
    <div class="acard"><div class="q"><span>Fotos</span><b>${Object.keys(A.shots).length}</b></div><div class="q" style="border:0"><span>Distancia al PDV</span><b>18 m</b></div></div>
    <button class="btn pri" style="width:100%" data-app="enviar">Enviar visita</button></div>`;
  }
}
function appNav(on){return `<div class="anav"><button class="${on==='ruta'?'on':''}" data-app="ruta">Ruta</button><button data-act="sync">Sincronizar</button><button data-go="dashboard">Ver dashboard</button></div>`}

// ---------- router y eventos ----------
function render(){
  const h=(location.hash||'#dashboard').slice(1);const view=VIEWS.some(v=>v[0]===h)?h:'dashboard';
  $('#nav').innerHTML=VIEWS.map(v=>`<a href="#${v[0]}" class="${v[0]===view?'on':''}" ${v[0]===view?'aria-current="page"':''}>${v[1]}</a>`).join('');
  $('#view').innerHTML={dashboard:vDashboard,rutas:vRutas,visitas:vVisitas,auditores:vAuditores,pdv:vPDV,reportes:vReportes,app:vApp}[view]();
}
function openDrawer(){$('#drawer').classList.add('open');$('#dbg').classList.add('open');$('#drawer').setAttribute('aria-hidden','false');$('#drawer').querySelector('button')?.focus()}
function closeDrawer(){$('#drawer').classList.remove('open');$('#dbg').classList.remove('open');$('#drawer').setAttribute('aria-hidden','true')}
function rerenderApp(){const el=$('#appscreen');if(el)el.innerHTML=appScreen();else render()}
window.addEventListener('hashchange',()=>{closeDrawer();render();window.scrollTo(0,0)});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.set){let v=t.value;if(['rDia'].includes(t.dataset.set))v=+v;state[t.dataset.set]=v;if(t.dataset.set==='rSede'||t.dataset.set==='rDia')state.rSel=null;state.vPage=0;state.pPage=0;render()}
  if(t.dataset.act==='import'&&t.files[0]){const r=new FileReader();r.onload=()=>{const n=Math.max(0,r.result.split(/\r?\n/).filter(Boolean).length-1);toast(`Archivo leído: ${n} PDV detectados. Se validarán códigos y coordenadas antes de cargarlos.`)};r.readAsText(t.files[0])}
});
document.addEventListener('input',e=>{const t=e.target;
  if(t.dataset.set==='vQ'||t.dataset.set==='pQ'){state[t.dataset.set]=t.value;state.vPage=0;state.pPage=0;clearTimeout(render.t);render.t=setTimeout(()=>{const pos=t.selectionStart;render();const n=document.querySelector(`[data-set="${t.dataset.set}"]`);n.focus();n.setSelectionRange(pos,pos)},250)}
  if('ansText' in t.dataset){state.app.ans.com=t.value}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer();if((e.key==='Enter'||e.key===' ')&&e.target.dataset.stop!=null){e.preventDefault();e.target.click()}});
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act],[data-go],[data-visit],[data-stop],[data-chip],[data-aud],[data-app],[data-ans],[data-shot],.mstop');if(!t)return;
  if(t.id==='dbg')return;
  if(t.classList.contains('mstop')){state.rSel=+t.dataset.i;render();return}
  if(t.dataset.go){if(t.dataset.sede)state.rSede=t.dataset.sede,state.rDia=DAYS_ELAPSED,state.rSel=null;location.hash=t.dataset.go;return}
  if(t.dataset.visit){visitDrawer(t.dataset.visit);return}
  if(t.dataset.stop!=null){state.rSel=+t.dataset.stop;render();return}
  if(t.dataset.chip){state.vEstado=t.dataset.chip;state.vPage=0;render();return}
  if(t.dataset.aud){state.aSel=t.dataset.aud;render();return}
  if(t.dataset.ans){state.app.ans[t.dataset.ans]=t.dataset.v==='1';rerenderApp();return}
  if(t.dataset.shot){const d=new Date();state.app.shots[t.dataset.shot]=`22/10/2026 ${d.toTimeString().slice(0,5)} · -12.21 -76.94`;rerenderApp();return}
  if(t.dataset.app){const a=state.app,go=t.dataset.app;
    if(go==='llegada'){a.stop=+t.dataset.i;a.ans={};a.shots={}}
    if(go==='enviar'){a.done[a.stop]=true;const p=appStops()[a.stop];const cerr=a.ans.abierto===false;const r={};IND.forEach(x=>r[x.k]=cerr?null:!!a.ans[x.k]);
      VIS.push({id:'V'+String(vid++).padStart(5,'0'),pdv:p.cod,nom:p.nom,sede:'LS',aud:'Auditor 04',dia:DAYS_ELAPSED,hora:new Date().toTimeString().slice(0,5),min:22,dist:18,fotos:Object.keys(a.shots).length,estado:cerr?'No efectiva':'Efectiva',val:'Pendiente',r,score:cerr?null:Math.round(IND.filter(x=>a.ans[x.k]).length/IND.length*100),com:a.ans.com||'Sin observaciones.'});
      DONE_TODAY.LS++;toast('Visita enviada. Ya aparece en el dashboard de CBC.');a.screen='ruta';rerenderApp();return}
    a.screen=go;rerenderApp();return}
  const act=t.dataset.act;
  if(act==='close')closeDrawer();
  if(act==='opt'){state.rOpt=!state.rOpt;state.rSel=null;render()}
  if(act==='prev'){state.vPage--;render()} if(act==='next'){state.vPage++;render()}
  if(act==='pprev'){state.pPage--;render()} if(act==='pnext'){state.pPage++;render()}
  if(act==='aclose'){state.aSel=null;render()}
  if(act==='val'||act==='obs'){const v=VIS.find(x=>x.id===t.dataset.id);v.val=act==='val'?'Validada':'Observada';toast(act==='val'?'Visita validada':'Visita observada: el auditor recibirá la observación');visitDrawer(v.id);render()}
  if(act==='app-reset'){state.app={screen:'ruta',stop:null,ans:{},shots:{},done:{}};rerenderApp()}
  if(act==='sync')toast('Todo sincronizado. No hay visitas pendientes de envío.');
  if(act==='fotos')toast('Se enviará el enlace al banco fotográfico al correo registrado.');
  if(act==='informe')toast('El informe ejecutivo de la primera quincena está disponible para descarga.');
  const head=['Visita','Día','Hora','Código PDV','PDV','Sede','Auditor','Duración (min)','Distancia GPS (m)','Fotos','Resultado','Score',...IND.map(x=>x.n),'Validación','Comentario'];
  const row=v=>[v.id,v.dia,v.hora,v.pdv,v.nom,sedeName(v.sede),v.aud,v.min,v.dist,v.fotos,v.estado,v.score??'',...IND.map(x=>v.r[x.k]==null?'':v.r[x.k]?'Cumple':'No cumple'),v.val,v.com];
  if(act==='export-dia')csv('auditorias_cbc_dia_'+DAYS_ELAPSED+'.csv',[head,...todayVis().filter(v=>state.sede==='all'||v.sede===state.sede).map(row)]);
  if(act==='export-vis')csv('auditorias_cbc_visitas.csv',[head,...filteredVisits().map(row)]);
  if(act==='export-vis-all')csv('auditorias_cbc_base_oct2026.csv',[head,...VIS.map(row)]);
  if(act==='export-sede')csv('auditorias_cbc_resumen_sedes.csv',[['Sede','PDV auditados',...IND.map(x=>x.n)],...SEDES.map(s=>{const vs=VIS.filter(v=>v.sede===s.id&&v.estado==='Efectiva');return [s.n,VIS.filter(v=>v.sede===s.id).length,...IND.map(x=>Math.round(vs.filter(v=>v.r[x.k]).length/Math.max(1,vs.length)*100)+'%')]})]);
  if(act==='export-ruta'){const s=state.rSede;let pts=PDV.filter(p=>p.sede===s&&p.dia===state.rDia);if(state.rOpt)pts=optRoute(pts);csv(`ruta_${s}_dia${state.rDia}.csv`,[['Orden','Código','PDV','Dirección','Distrito'],...pts.map((p,i)=>[i+1,p.cod,p.nom,p.dir,p.dist])])}
  if(act==='export-aud')csv('auditores_cbc.csv',[['Auditor','Sede','Ingreso hoy','PDV mes'],...AUD.map(a=>[a.n,sedeName(a.sede),INGRESO[a.sede],VIS.filter(v=>v.sede===a.sede).length])]);
});
$('#dbg').addEventListener('click',closeDrawer);
render();
</script>
</body>
</html>
